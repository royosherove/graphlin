name: CI

on:
  push:
    # main runs this entire workflow through release.yml before publishing.
    branches: ['**', '!main']
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24', '26']
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      # Install the pinned WASM parser without running dependency lifecycle scripts.
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run validate
      - run: npm test
        timeout-minutes: 5
      - run: npm run build
      - run: npm run pack:check
